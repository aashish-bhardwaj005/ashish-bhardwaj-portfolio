<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ashish Bhardwaj | Senior Frontend & eCommerce Developer</title>
    <meta name="description" content="Portfolio of Ashish Bhardwaj - Senior Frontend Developer with 10+ years experience in Shopify Liquid, WordPress, WooCommerce, React, and Figma to pixel-perfect code." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              brand: {
                cyan: '#06b6d4',
                purple: '#8b5cf6',
                pink: '#ec4899',
                emerald: '#10b981',
                dark: '#0b0f19',
                card: 'rgba(17, 24, 39, 0.75)',
              }
            },
            animation: {
              'pulse-glow': 'pulseGlow 6s ease-in-out infinite',
              'float': 'float 5s ease-in-out infinite',
            },
            keyframes: {
              pulseGlow: {
                '0%, 100%': { opacity: 0.3, transform: 'scale(1)' },
                '50%': { opacity: 0.6, transform: 'scale(1.08)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#0b0f19] text-gray-100 antialiased selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
